[project]
name = "adaptivebi-graph-service"
version = "0.1.0"
description = "Isolated LangChain / LangGraph migration harness; synthetic data only"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "langchain-core>=1,<2",
  "langgraph>=1,<2",
  "sqlglot>=28,<31",
  "httpx>=0.28,<1",
  "pyjwt>=2.8,<3",
]

[dependency-groups]
dev = ["pytest>=8,<9", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pypi-mirror"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
